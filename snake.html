<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake 🐍</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0d0d1a;
    color: #f0f0ff;
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    padding: 16px;
  }
  h1 {
    font-family: 'Boogaloo', cursive;
    font-size: clamp(2rem, 7vw, 3rem);
    background: linear-gradient(135deg, #6bcb77, #4d96ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .hud {
    display: flex;
    gap: 20px;
    margin-bottom: 12px;
  }
  .hud-box {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 6px 22px;
    text-align: center;
    min-width: 90px;
  }
  .hud-label { font-size: 0.6rem; letter-spacing: 2px; color: #555; text-transform: uppercase; }
  .hud-val { font-family: 'Boogaloo', cursive; font-size: 1.6rem; color: #6bcb77; }

  .diff-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .diff-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #666;
    font-family: 'Boogaloo', cursive;
    font-size: 0.9rem;
    padding: 5px 16px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .diff-btn.active { background: #6bcb77; color: #0d1a10; border-color: #6bcb77; }

  canvas {
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    display: block;
    background: #0a0a14;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 5px;
    margin-top: 14px;
  }
  .dp {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: #f0f0ff;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
  }
  .dp:active { background: rgba(107,203,119,0.2); }
  .dp.empty { border: none; background: transparent; pointer-events: none; }

  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    font-family: 'Boogaloo', cursive;
    font-size: 1rem;
    padding: 9px 28px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    letter-spacing: 1px;
    background: #6bcb77;
    color: #0d1a10;
    transition: filter 0.2s;
  }
  .btn:hover { filter: brightness(1.1); }
  .hint { font-size: 0.78rem; color: #333; margin-top: 8px; letter-spacing: 1px; }
</style>
</head>
<body>

<h1>🐍 SNAKE</h1>

<div class="hud">
  <div class="hud-box">
    <div class="hud-label">Score</div>
    <div class="hud-val" id="sc">0</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Best</div>
    <div class="hud-val" id="bs">0</div>
  </div>
</div>

<div class="diff-row">
  <button class="diff-btn active" onclick="setDiff('slow',this)">🟢 Slow</button>
  <button class="diff-btn" onclick="setDiff('med',this)">🟡 Medium</button>
  <button class="diff-btn" onclick="setDiff('fast',this)">🔴 Fast</button>
</div>

<canvas id="sg"></canvas>

<div class="dpad">
  <div class="dp empty"></div>
  <div class="dp" onclick="tryDir(0,-1)">▲</div>
  <div class="dp empty"></div>
  <div class="dp" onclick="tryDir(-1,0)">◀</div>
  <div class="dp empty"></div>
  <div class="dp" onclick="tryDir(1,0)">▶</div>
  <div class="dp empty"></div>
  <div class="dp" onclick="tryDir(0,1)">▼</div>
  <div class="dp empty"></div>
</div>

<div class="btn-row">
  <button class="btn" onclick="startGame()">🔄 New Game</button>
</div>
<div class="hint" id="hint">Arrow keys ya d-pad se chalao</div>

<script>
  const CELL = 20, COLS = 15, ROWS = 15;
  const W = COLS * CELL, H = ROWS * CELL;
  const canvas = document.getElementById('sg');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const SPEEDS = { slow: 200, med: 130, fast: 70 };
  let speed = 200, snake, dir, nextDir, apple, score, best = 0, loop, running = false, started = false;

  function startGame() {
    clearInterval(loop);
    snake = [{x:7,y:7},{x:6,y:7},{x:5,y:7}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; running = false; started = false;
    placeApple(); updateHUD(); draw();
    document.getElementById('hint').textContent = 'Arrow keys ya d-pad se chalao';
  }

  function go() {
    if (!running) {
      running = true;
      loop = setInterval(tick, speed);
      document.getElementById('hint').textContent = 'Apple khao! 🍎';
    }
  }

  function setDiff(d, el) {
    speed = SPEEDS[d];
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    if (running) { clearInterval(loop); loop = setInterval(tick, speed); }
  }

  function tryDir(x, y) {
    if (!started) { started = true; go(); }
    if (dir.x !== -x || dir.y !== -y) nextDir = {x, y};
  }

  function placeApple() {
    let pos;
    do { pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)}; }
    while (snake.some(s => s.x===pos.x && s.y===pos.y));
    apple = pos;
  }

  function tick() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)) {
      clearInterval(loop); running = false; draw(); gameOver(); return;
    }
    snake.unshift(head);
    if (head.x===apple.x && head.y===apple.y) {
      score++; if(score>best) best=score;
      updateHUD(); placeApple();
    } else { snake.pop(); }
    draw();
  }

  function draw() {
    ctx.clearRect(0,0,W,H);

    // Grid dots
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++) {
      ctx.beginPath(); ctx.arc(x*CELL+CELL/2, y*CELL+CELL/2, 1, 0, Math.PI*2); ctx.fill();
    }

    // Snake
    snake.forEach((s,i) => {
      const alpha = i===0 ? 1 : Math.max(0.3, 1 - i*0.045);
      ctx.fillStyle = i===0 ? `rgba(107,203,119,1)` : `rgba(107,203,119,${alpha})`;
      ctx.beginPath();
      ctx.roundRect(s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4, CELL*0.35);
      ctx.fill();

      // Eyes on head
      if(i===0) {
        const ex=dir.x, ey=dir.y;
        ctx.fillStyle = '#0a0a14';
        const cx=s.x*CELL+CELL/2, cy=s.y*CELL+CELL/2;
        const ox=ey!==0?3:0, oy=ex!==0?3:0;
        ctx.beginPath(); ctx.arc(cx+ex*3-oy, cy+ey*3-ox, 2.2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+ex*3+oy, cy+ey*3+ox, 2.2, 0, Math.PI*2); ctx.fill();
      }
    });

    // Apple
    ctx.fillStyle = '#ff4757';
    ctx.beginPath();
    ctx.arc(apple.x*CELL+CELL/2, apple.y*CELL+CELL/2, CELL*0.36, 0, Math.PI*2);
    ctx.fill();
    // Stem
    ctx.strokeStyle = '#6bcb77';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(apple.x*CELL+CELL/2, apple.y*CELL+CELL/2 - CELL*0.36);
    ctx.lineTo(apple.x*CELL+CELL/2+3, apple.y*CELL+CELL/2 - CELL*0.36 - 4);
    ctx.stroke();

    // Game over overlay
    if(!running && started) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#f0f0ff';
      ctx.font = '500 18px Boogaloo, cursive';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER!', W/2, H/2-12);
      ctx.font = '14px Nunito, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('Score: ' + score, W/2, H/2+14);
    }
  }

  function gameOver() {
    document.getElementById('hint').textContent = 'New Game dabao! 🔄';
  }

  function updateHUD() {
    document.getElementById('sc').textContent = score;
    document.getElementById('bs').textContent = best;
  }

  document.addEventListener('keydown', e => {
    const map = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0] };
    if(map[e.key]) { e.preventDefault(); const [x,y]=map[e.key]; tryDir(x,y); }
  });

  startGame();
</script>
</body>
</html>
